name: ci

# This is the first CI this module has had, so it also sets the bar for the
# contract external developers compile against. It is aligned with the arqtos
# house standard (arqtos-cli/.github/workflows/ci.yml): OS matrix, module
# verification, vet + staticcheck, race + coverage with a floor. Where this
# workflow departs from it, the reason is stated at the step.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build · lint · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Checksum-verifies every module in the graph against go.sum before any
      # of it is compiled.
      - name: go mod verify
        run: go mod download && go mod verify

      - name: go build
        run: go build ./...

      # This SDK is the public IP boundary the external-developer model
      # rests on. Walks both the require graph (go mod graph) and the
      # import graph (go list -deps -test) for any arqtiqa module other
      # than this one, direct or transitive, and names the import chain
      # when it finds one. See scripts/check-ip-isolation.sh for why a
      # go.mod grep does not do this job. Runs on every OS in the matrix,
      # not just once — the require/import graph can differ across build
      # tags.
      - name: IP isolation (no arqtos-cli / arqtiqa dependency)
        run: make ip-isolation

      # ⚠️ Invokes THIS repo's `make fmt-check` via the shared action (arqtos#315)
      # — it must stay `fmt-check`, never `fmt`. ADR-ARQ-J-02 made `fmt` WRITE
      # (matching `go fmt`), so invoking that here would silently format the
      # checkout and pass: a formatting gate that can never fail. The action's
      # `make-target` input defaults to `fmt-check` for exactly this reason.
      #
      # Pinned @v1 per arqtos-actions/ci-baseline.yml — moving-tag, with the
      # firewall as the SHA-pinned exception because its silent failure is
      # unrecoverable and formatting's is self-correcting.
      - uses: arqtiqa/arqtos-actions/.github/actions/go-fmt@v1

      - name: go vet
        run: make lint

      # Catches what vet does not. `go vet` alone was this workflow's whole
      # lint bar on first submission; that was below the house standard.
      #
      # ⚠️ `go tool`, not `go install …@latest` (arqtos-connectors#231). The
      # version is pinned in go.mod, so CI and a developer's laptop run the
      # SAME staticcheck — and a new upstream release can no longer turn this
      # repo red on a day nobody touched it, which for a shared repo means
      # mid-release-train with the whole diamond behind it.
      - name: staticcheck
        run: go tool staticcheck ./...

      # A dependency nothing imports is dropped by the next `go mod tidy`, so
      # this is what proves the MCP SDK dependency is genuinely used rather
      # than a require line awaiting deletion. Repo-invariant, not
      # OS-dependent, so it runs once rather than per matrix leg — and it is
      # the only step that reaches the module proxy a second time.
      - name: go.mod is tidy
        if: matrix.os == 'ubuntu-latest'
        run: make tidy-check

      # -json is recorded so the next step can prove the run was not vacuous.
      - name: go test -race + coverage
        run: |
          set -o pipefail
          go test -race ./... -count=1 -json \
            -coverprofile=coverage.txt -covermode=atomic | tee test-report.json

      - name: the test gate is not vacuous
        if: always()
        run: bash .github/scripts/assert-tests-ran.sh test-report.json

      # Same 75% floor as arqtos-cli. See the script for the two package trees
      # excluded from the denominator and why each is a measurement correction.
      - name: coverage gate (>= 75%)
        if: matrix.os == 'ubuntu-latest'
        run: bash .github/scripts/coverage-gate.sh coverage.txt

      - name: upload test report and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}
          path: |
            test-report.json
            coverage.txt
          if-no-files-found: warn
          retention-days: 7
