version: v2
modules:
  - path: proto/connector/v1
lint:
  use: [STANDARD]
  # Module root is narrowed to proto/connector/v1 (rather than proto/) so that
  # paths=source_relative in buf.gen.yaml emits flat files directly into
  # connectorpb/ (AC: import "github.com/arqtiqa/arqtos-sdk-go/connectorpb"
  # resolves) instead of nesting under connectorpb/connector/v1/. That
  # deliberately puts the single proto file at the module root while its
  # package is connector.v1, which trips PACKAGE_DIRECTORY_MATCH — excepted
  # here since it is a known, accepted consequence of the chosen layout.
  except:
    - PACKAGE_DIRECTORY_MATCH
    # SERVICE_SUFFIX wants every service named "*Service" (e.g.
    # CredentialLoaderService). We deliberately name it "CredentialLoader"
    # instead, to mirror the credential.CredentialLoader Go interface 1:1 --
    # the proto service and the Go interface it backs share one name across
    # the wire boundary, which is the whole point of the Track-B contract.
    # Renaming the service to satisfy the linter would break that mirroring
    # for no benefit, so the rule is excepted here rather than the code
    # changed.
    - SERVICE_SUFFIX
    # RPC_REQUEST_RESPONSE_UNIQUE wants each request/response message used by
    # exactly ONE rpc. The base-contract messages in connector.proto
    # (HealthRequest/Response, CapabilitiesRequest/Response,
    # CloseRequest/Response) are deliberately shared by every class's service,
    # because Health means the same thing for a secret store and for a
    # directory and a host reads the same fields off either. Satisfying the
    # rule would mean one copy per class — definitions growing with the class
    # count while the meaning stayed fixed, and copies free to drift. That is
    # the restating-instead-of-deriving failure this SDK removes everywhere
    # else, so the rule is excepted rather than the contract duplicated.
    - RPC_REQUEST_RESPONSE_UNIQUE
