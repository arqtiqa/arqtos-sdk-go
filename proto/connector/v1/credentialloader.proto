syntax = "proto3";
package connector.v1;
option go_package = "github.com/arqtiqa/arqtos-sdk-go/connectorpb";

message Ref { string vault = 1; string item = 2; string field = 3; }
message Material { bytes value = 1; }
message Lease { string id = 1; int64 ttl_seconds = 2; int64 expires_at_unix = 3; bool renewable = 4; }

message ResolveRequest { Ref ref = 1; }
message ResolveResponse { Material material = 1; }
message ListRequest { string scope = 1; }
message ListResponse { repeated Ref refs = 1; }
message LeaseRequest { Ref ref = 1; }
message LeaseResponse { Material material = 1; Lease lease = 2; }
message RenewRequest { Lease lease = 1; }
message RenewResponse { Lease lease = 1; }
message RevokeRequest { Lease lease = 1; }
message RevokeResponse {}
message HealthRequest {}
message HealthResponse { int32 status = 1; string detail = 2; }
message CapabilitiesRequest {}
message CapabilitiesResponse { repeated string capabilities = 1; }

service CredentialLoader {
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Lease(LeaseRequest) returns (LeaseResponse);
  rpc Renew(RenewRequest) returns (RenewResponse);
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesResponse);
}
