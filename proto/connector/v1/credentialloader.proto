// The Track-B wire contract for the arqtos CredentialLoader connector class.
//
// This file is the contract for provider authors who will never read the Go
// SDK — including authors writing in another language. Everything a host
// relies on is stated here, in this file, rather than only in the Go doc
// comments of the reference implementation. If the two ever disagree, this
// file is what the wire actually carries.
//
// # The one rule that matters most
//
// A credential that DID NOT RESOLVE must never reach a host looking like a
// credential whose value is empty. That conflation is the bug this whole
// contract exists to prevent: a signed-out secret backend typically prints
// NOTHING and exits 0, and a provider that forwards that faithfully as a
// success hands the host "" — which then authenticates with an empty
// password instead of failing.
//
// So on this wire, "I resolved nothing" and "I resolved a value that is
// genuinely empty" have DIFFERENT encodings, and the accidental encoding —
// whatever a provider naturally emits when it has nothing — always means
// "resolved nothing", which is the safe reading. See Material below.

syntax = "proto3";

package connector.v1;

option go_package = "github.com/arqtiqa/arqtos-sdk-go/connectorpb";

// Ref is an op://<vault>/<item>/<field> secret reference: the ADDRESS of a
// secret, never the secret itself. All three segments are required and
// non-empty; a host sends only refs, and a provider returns only the material
// for the ref it was asked about.
message Ref {
  string vault = 1;
  string item = 2;
  string field = 3;
}

// Material is resolved secret material, and the presence rules below are the
// contract's load-bearing part.
//
// Read the three cases as a WHOLE MESSAGE, not as a bytes field:
//
//   1. NO Material message at all (the containing field is unset)
//      -> nothing was resolved. The host treats this as a failure and refuses
//         to produce a readable credential from it.
//
//   2. Material with `value` non-empty
//      -> that is the secret. `empty_by_assertion` is ignored here; bytes
//         present always mean a resolved value.
//
//   3. Material with no `value` bytes AND `empty_by_assertion = true`
//      -> the provider ASSERTS the stored secret is genuinely, intentionally
//         empty. The host produces a readable credential of length zero.
//
//   4. Material with no `value` bytes and NO `empty_by_assertion`
//      -> nothing was resolved. Identical to case 1. This is deliberate: it
//         is the encoding a provider produces by accident (an unset struct,
//         a default-constructed message, a "" it forwarded from a backend),
//         and the accidental encoding must have the SAFE meaning.
//
// Note that proto3 does not put a zero-length `bytes` field on the wire at
// all, so cases 3 and 4 differ ONLY by the boolean. That is exactly why the
// boolean exists: without it, a conformant "deliberately empty" and a rogue
// "I got nothing" are byte-identical and the host cannot tell them apart.
message Material {
  // The secret bytes. Empty or absent means NO VALUE unless
  // empty_by_assertion is set — see the message comment above.
  bytes value = 1;

  // Set this ONLY to assert "this credential is deliberately, genuinely
  // empty". Set it only if your backend can distinguish a STORED EMPTY VALUE
  // from an unauthenticated, missing, or failed read. If it cannot make that
  // distinction, you have a failure on your hands, not an empty secret:
  // return a gRPC status error instead (see the error mapping below).
  //
  // Absent bytes WITHOUT this flag means nothing was resolved, and the host
  // refuses it — naming your connector in the fault it reports.
  bool empty_by_assertion = 2;
}

// Lease describes a dynamic, time-bounded secret's validity window.
message Lease {
  string id = 1;
  int64 ttl_seconds = 2;
  int64 expires_at_unix = 3;
  bool renewable = 4;
}

// Failure is ONE reference's typed failure inside a batch response.
//
// A whole-call failure is a gRPC status error on the RPC itself. This message
// exists because a batch RPC that SUCCEEDED can still carry a per-reference
// failure, and one missing field must not discard the other ninety-nine
// values fetched with it.
//
// `code` is a google.rpc.Code / gRPC status code number, carrying the same
// classification a single Resolve would return as a status error; `message`
// is the human-readable detail. A host maps the code back into its closed
// error vocabulary, so it acts on the classification and never on the text.
//
// MUST NOT contain secret material: unlike Material, failure text crosses the
// wire verbatim and a host may write it to an audit log.
message Failure {
  int32 code = 1;
  string message = 2;
}

message ResolveRequest {
  Ref ref = 1;
}

// ResolveResponse carries the resolved material, subject to Material's
// presence rules. An UNSET material field means nothing was resolved; it is
// the correct way to say so alongside a non-error response, though returning
// a gRPC status error is better still because it also says WHY.
message ResolveResponse {
  Material material = 1;
}

message ListRequest {
  string scope = 1;
}

// ListResponse returns REFERENCES ONLY. A List must never resolve material
// for the entries it enumerates.
message ListResponse {
  repeated Ref refs = 1;
}

message LeaseRequest {
  Ref ref = 1;
}

// LeaseResponse carries the leased material — same Material presence rules as
// ResolveResponse — plus the lease describing its validity window.
message LeaseResponse {
  Material material = 1;
  Lease lease = 2;
}

message RenewRequest {
  Lease lease = 1;
}

message RenewResponse {
  Lease lease = 1;
}

message RevokeRequest {
  Lease lease = 1;
}

message RevokeResponse {}

message HealthRequest {}

// HealthResponse reports reachability of the backing store. `status` is
// 0 = healthy, 1 = degraded, 2 = unavailable.
message HealthResponse {
  int32 status = 1;
  string detail = 2;
}

message CapabilitiesRequest {}

// CapabilitiesResponse lists the optional behaviours this connector supports,
// drawn from the class's closed capability vocabulary — for CredentialLoader:
// "read", "lease", "rotate", "oidc", "approle", "batch_resolve".
//
// This list is load-bearing at DIAL TIME, not only for documentation: a host
// decides from it whether this provider can be asked to batch, and it must
// agree with the connector's shipped manifest. Declaring a capability the
// provider does not honour is worse than declaring nothing at all.
message CapabilitiesResponse {
  repeated string capabilities = 1;
}

// ResolveBatchRequest asks for many references in ONE call.
message ResolveBatchRequest {
  repeated Ref refs = 1;
}

// ResolveBatchResult is ONE requested reference's outcome: EXACTLY ONE of a
// resolved material or a typed failure, never both and never neither.
//
//   - `ref` echoes the reference this result answers, so a host can attribute
//     a result without relying on position alone. It is required.
//   - `material` follows Material's presence rules exactly, including
//     `empty_by_assertion`. Absent-and-unasserted means nothing was resolved.
//   - `failure` is this reference's typed failure.
//
// A result carrying NEITHER — no failure, and no material or an unasserted
// empty one — is a contract violation the host reports against your
// connector by name. It is not read as an empty credential.
message ResolveBatchResult {
  Ref ref = 1;
  Material material = 2;
  Failure failure = 3;
}

// ResolveBatchResponse returns EXACTLY ONE result per requested reference, IN
// THE REQUESTED ORDER. A host verifies both, and refuses the whole batch if
// either is wrong: it cannot attribute mismatched results to the references
// it asked about, and guessing the correspondence is how the wrong secret
// reaches the wrong caller.
message ResolveBatchResponse {
  repeated ResolveBatchResult results = 1;
}

// CredentialLoader is the out-of-process (Track-B) service a provider serves
// and a host dials. It mirrors the credential.CredentialLoader Go interface
// 1:1.
//
// # Errors
//
// Every failure is a gRPC status error whose CODE carries the
// classification — a host acts on the code, never on the message text:
//
//   NOT_FOUND           the ref, scope or lease does not exist
//   PERMISSION_DENIED   no access, including a backend session not signed in
//   UNAVAILABLE         the backing store is transiently unreachable
//   UNIMPLEMENTED       this connector does not support the operation
//   INVALID_ARGUMENT    malformed ref, unknown lease id
//   DEADLINE_EXCEEDED   the operation timed out
//   RESOURCE_EXHAUSTED  the backend reported a quota or rate limit
//   INTERNAL            reserved for host-detected contract violations
//   UNKNOWN             the provider could not classify the failure
//
// Error MESSAGES cross the wire verbatim and may be logged by the host, so
// they MUST NOT contain secret material.
service CredentialLoader {
  // Resolve resolves ONE reference. See Material for what an empty or absent
  // material means — getting that wrong is the failure this contract is
  // built around.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);

  // List enumerates references under a connector-defined scope. Refs only.
  rpc List(ListRequest) returns (ListResponse);

  // Lease resolves a dynamic, time-bounded secret and returns its lease.
  rpc Lease(LeaseRequest) returns (LeaseResponse);

  // Renew extends a lease previously returned by Lease.
  rpc Renew(RenewRequest) returns (RenewResponse);

  // Revoke invalidates a lease early. Idempotent.
  rpc Revoke(RevokeRequest) returns (RevokeResponse);

  // Health reports reachability of the backing store.
  rpc Health(HealthRequest) returns (HealthResponse);

  // Capabilities lists what this connector supports.
  rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesResponse);

  // ResolveBatch resolves many references in ONE backend call.
  //
  // It is OPTIONAL, and gated: implement it only if you also report
  // "batch_resolve" from Capabilities and declare it in your manifest. A
  // provider that does not support it returns UNIMPLEMENTED.
  //
  // A returned status error means the batch CALL failed. A per-reference
  // failure belongs in that reference's ResolveBatchResult.failure, so one
  // missing field does not discard everything fetched with it.
  rpc ResolveBatch(ResolveBatchRequest) returns (ResolveBatchResponse);
}
